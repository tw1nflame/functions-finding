[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parametric-regression"
version = "0.2.0"
description = "Interpretable parametric and two-stage multi-experiment regression"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3",
    "pandas>=2.0", "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]
notebook = ["jupyterlab>=4", "nbclient>=0.10", "ipykernel>=6"]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4,<6",
    "sphinx>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", "artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
